name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo build --all-targets
      - run: cargo test --all-targets
      - run: cargo run -p rite-codegen -- check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --all -- --check

  creed:
    name: Creed context drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install creed
        run: go install github.com/techgodhq/creed@v0.3.0
      - name: Emitted agent context must match .creed source
        run: creed diff
