[[rites]]
name = "github-pr-opened"
source = "github"
match = { event_type = "pull_request", action = "opened" }
action = { type = "http_post", url = "https://example.test/hooks/pr" }

[sources.iris]
enabled = true
base_url = "http://127.0.0.1:3000"
# api_token = "set-through-your-secret-manager"

# Uptime Kuma sends base64 HMAC-SHA256 in its Signature header. A secret is required.
[sources.uptime_kuma]
enabled = true
secret = "change-me"

[[rites]]
name = "discord-urgent-alert"
source = "iris"
match = { provider = "telegram", body_contains = "URGENT" }
action = { type = "http_post", url = "https://example.test/hooks/urgent", headers = { "content-type" = "application/json" }, body_template = "{\"content\":\"{{title}}: {{body}}\"}" }

[[rites]]
name = "inbox-attention"
source = "iris"
match = { all_of = [{ path_equals = { path = ["metadata", "message", "source"], value = "agent_hook" } }, { path_equals = { path = ["metadata", "message", "metadata", "schema_version"], value = 1 } }, { path_equals = { path = ["metadata", "message", "metadata", "installation_id"], value = "synthetic-alpha" } }, { path_equals = { path = ["metadata", "message", "metadata", "event_kind"], value = "attention_required" } }, { path_equals = { path = ["metadata", "message", "metadata", "direction"], value = "inbound" } }, { path_equals = { path = ["metadata", "message", "metadata", "content_opt_in"], value = true } }] }
action = { type = "http_post", url = "https://example.test/hooks/inbox" }
