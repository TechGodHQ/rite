# Rite API operation definition — single source of truth for generated surfaces.
# Generated by hydra (github.com/TechGodHQ/hydra); regenerate with
# `cargo run -p rite-codegen -- write` and commit the artifacts.
operations:
  - name: list_sources
    description: List configured event sources.
    method: GET
    path: /sources
    read: true
    output_type: Vec<SourceResponse>
    parameters: []
  - name: list_handlers
    description: List configured rites (event-to-action handlers).
    method: GET
    path: /handlers
    read: true
    output_type: Vec<RiteHandler>
    parameters: []
  - name: get_handler
    description: Get one configured rite by ID.
    method: GET
    path: /handlers/{handler_id}
    read: true
    output_type: RiteHandler
    parameters:
      - name: handler_id
        description: Handler ID to fetch.
        type: string
        required: true
        location: path
  - name: receive_event
    description: Receive a raw webhook delivery for HMAC-verified event ingress.
    method: POST
    path: /event/{source}
    read: false
    output_type: Value
    parameters:
      - name: source
        description: Event source ID (e.g. github).
        type: string
        required: true
        location: path
    surfaces: [http]
    raw_request: true
