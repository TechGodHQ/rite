# Rite API operation definition — single source of truth for generated surfaces.
# Generated by hydra (github.com/TechGodHQ/hydra); regenerate with
# `cargo run -p rite-codegen -- write` and commit the artifacts.
operations:
  - name: list_sources
    description: List configured event sources.
    method: GET
    path: /sources
    read: true
    output_type: Vec<SourceResponse>
    parameters: []
  - name: list_handlers
    description: List configured rites (event-to-action handlers).
    method: GET
    path: /handlers
    read: true
    output_type: Vec<RiteHandler>
    parameters: []
  - name: get_handler
    description: Get one configured rite by ID.
    method: GET
    path: /handlers/{handler_id}
    read: true
    output_type: RiteHandler
    parameters:
      - name: handler_id
        description: Handler ID to fetch.
        type: string
        required: true
        location: path
  # receive_event (/event/{source}) stays HANDWRITTEN in rite-server: webhook
  # ingress needs raw headers + bytes for HMAC signature verification, which
  # the generated operation contract does not carry yet. Revisit when hydra
  # grows raw-request passthrough.
